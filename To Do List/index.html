<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container d-flex justify-content-between">
      <a class="navbar-brand fw-semibold" href="#">&#10003; TodoList</a>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text text-white-50 small d-none d-sm-inline">Stay organised, one task at a time</span>
        <button id="themeToggle" class="btn btn-outline-light btn-sm" type="button"
                aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
      </div>
    </div>
  </nav>

  <main class="container my-4 my-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-6">

        <h1 class="text-center mb-4 page-heading">My To-Do List</h1>

        <div class="card shadow-sm app-card">
          <div class="card-body p-3 p-md-4">

            <div class="input-group">
              <input type="text" id="taskInput" class="form-control form-control-lg"
                     placeholder="What needs to be done?" aria-label="New task" maxlength="100">
              <button id="addBtn" class="btn btn-primary btn-lg" type="button">Add Task</button>
            </div>

            <div id="errorMsg" class="text-danger small mt-2 d-none" role="alert"></div>

            <div class="btn-group w-100 my-4" role="group" aria-label="Filter tasks">
              <button type="button" class="btn btn-outline-primary active" data-filter="all">All</button>
              <button type="button" class="btn btn-outline-primary" data-filter="active">Active</button>
              <button type="button" class="btn btn-outline-primary" data-filter="completed">Completed</button>
            </div>

            <ul id="taskList" class="list-group list-group-flush"></ul>
            <p id="emptyMsg" class="text-center text-muted my-4 d-none">No tasks to show.</p>

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 mt-4">
              <span id="taskCounter" class="fw-semibold text-secondary">0 tasks left</span>
              <button id="clearBtn" class="btn btn-outline-danger btn-sm" type="button">Clear Completed</button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="text-center text-muted small pb-4">Full Stack Development Practical &ndash; To-Do List</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
